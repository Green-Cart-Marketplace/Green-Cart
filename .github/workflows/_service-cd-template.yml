name: Reusable Service CD

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      target_port:
        required: true
        type: string
      build_args:
        required: false
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true
      AZURE_REGISTRY_USERNAME:
        required: true
      AZURE_REGISTRY_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_USERNAME }}.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ secrets.AZURE_REGISTRY_USERNAME }}.azurecr.io/${{ inputs.service_name }}:${{ github.sha }}"
          LATEST_TAG="${{ secrets.AZURE_REGISTRY_USERNAME }}.azurecr.io/${{ inputs.service_name }}:latest"
          
          docker build ${{ inputs.build_args }} -t $IMAGE_TAG -t $LATEST_TAG ./${{ inputs.service_name }}
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          acrUsername: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          acrPassword: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
          containerAppName: greencart-${{ inputs.service_name }}
          resourceGroup: greencart-rg
          containerAppEnvironment: greencart-env
          imageToDeploy: ${{ secrets.AZURE_REGISTRY_USERNAME }}.azurecr.io/${{ inputs.service_name }}:${{ github.sha }}
